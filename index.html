<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<title>Monitoring IPP Kupang</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{--bg:#0f1b2d;--panel:#16263d;--panel2:#1c3150;--text:#e6edf5;--muted:#8fa3bd;--line:#2a4163;--accent:#2fae63;--amber:#f5a524}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif}
  /* Tampilan monitoring (iframe layar penuh) */
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
  /* Layar pembuka / pengaturan */
  #awal{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .kotak{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 18px}
  .kotak img{width:64px;height:64px;display:block;margin:0 auto 10px}
  h1{font-size:19px;text-align:center;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;text-align:center;margin:0 0 20px;line-height:1.5}
  button{width:100%;font-size:15px;font-weight:600;padding:13px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
  button.utama{background:var(--accent);border-color:var(--accent);color:#06210f}
  .pisah{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0}
  .pisah::before,.pisah::after{content:"";flex:1;height:1px;background:var(--line)}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input{width:100%;font-size:15px;padding:12px;border-radius:9px;border:1px solid var(--line);background:#0b1524;color:var(--text);margin-bottom:10px}
  .galat{color:#ff8080;font-size:13px;min-height:18px;margin:-4px 0 8px}
  .catatan{color:var(--muted);font-size:12px;line-height:1.5;margin-top:18px}
  /* Tombol pengaturan kecil di atas tampilan monitoring */
  #gear{position:fixed;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));width:40px;height:40px;padding:0;border-radius:50%;
        display:none;align-items:center;justify-content:center;font-size:18px;background:rgba(28,49,80,.85);border:1px solid var(--line);z-index:5;opacity:.75}
  #menu{position:fixed;right:10px;bottom:calc(62px + env(safe-area-inset-bottom));width:230px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:none;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  #menu button{font-size:14px;font-weight:500;padding:10px;margin:3px 0;text-align:left}
  #menu .info{font-size:12px;color:var(--muted);padding:4px 6px 6px}
</style>
</head>
<body>

<!-- ===== Layar pembuka: pilih cara masuk (muncul sekali, lalu diingat di HP) ===== -->
<div id="awal">
  <div class="kotak">
    <img src="icons/icon-192.png" alt="">
    <h1>Monitoring IPP Kupang</h1>
    <p class="sub">PLTS IPP Kupang · Zona A–E<br>PT Surya Energi Indotama</p>

    <button class="utama" onclick="pilihSEI()">Masuk dengan akun SEI</button>
    <p class="catatan" style="margin-top:8px;text-align:center">Untuk karyawan @suryaenergi.com</p>

    <div class="pisah">atau, untuk tamu</div>

    <label for="kode">Kode akses atau link tamu</label>
    <input id="kode" placeholder="Tempel kode / link dari tim O&amp;M SEI" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="galat" id="galat"></div>
    <button onclick="pilihTamu()">Masuk sebagai tamu</button>

    <p class="catatan">Pilihan ini disimpan di HP ini. Untuk mengganti, ketuk tombol ⚙ di pojok kanan bawah saat aplikasi terbuka.</p>
  </div>
</div>

<!-- ===== Tampilan monitoring ===== -->
<iframe id="app" title="Monitoring IPP Kupang" allow="fullscreen"></iframe>

<button id="gear" aria-label="Pengaturan" onclick="toggleMenu()">⚙</button>
<div id="menu">
  <div class="info" id="infoMode"></div>
  <button onclick="muatUlang()">↻ Muat ulang</button>
  <button onclick="bukaBrowser()">Buka di browser</button>
  <button onclick="gantiAkses()">Ganti cara masuk</button>
</div>

<script>
/* ===================== PENGATURAN =====================
   ID deployment web app Apps Script (Deploy > Manage deployments).
   Tidak perlu diubah selama link web monitoring tetap sama. */
const DEPLOY_ID = 'AKfycbx8CQerWT57siIHxwsyui9ng9NV0FwGmsu0UlKunWK2fWoZOH-N5RhvjFfCUh0OOjFs';
const DOMAIN    = 'suryaenergi.com';
const URL_SEI   = 'https://script.google.com/a/macros/' + DOMAIN + '/s/' + DEPLOY_ID + '/exec';
const URL_TAMU  = 'https://script.google.com/macros/s/' + DEPLOY_ID + '/exec?k=';
/* ====================================================== */

const KUNCI = 'ippKupangAkses';
function baca(){ try { return JSON.parse(localStorage.getItem(KUNCI) || 'null'); } catch(e){ return null; } }
function simpan(v){ try { localStorage.setItem(KUNCI, JSON.stringify(v)); } catch(e){} }
function hapus(){ try { localStorage.removeItem(KUNCI); } catch(e){} }

function urlDari(a){ return a.mode === 'tamu' ? URL_TAMU + encodeURIComponent(a.kode) : URL_SEI; }

function tampilkan(a){
  const f = document.getElementById('app');
  f.src = urlDari(a);
  f.style.display = 'block';
  document.getElementById('awal').style.display = 'none';
  document.getElementById('gear').style.display = 'flex';
  document.getElementById('infoMode').textContent = a.mode === 'tamu' ? 'Masuk sebagai tamu' : 'Masuk dengan akun SEI';
}

function pilihSEI(){ const a = { mode:'sei' }; simpan(a); tampilkan(a); }

/* Terima kode saja, atau link tamu lengkap (…/exec?k=KODE) */
function ambilKode(t){
  t = String(t || '').trim();
  const m = t.match(/[?&]k=([A-Za-z0-9]+)/);
  if (m) return m[1];
  return /^[A-Za-z0-9]{8,40}$/.test(t) ? t : '';
}
function pilihTamu(){
  const k = ambilKode(document.getElementById('kode').value);
  const g = document.getElementById('galat');
  if (!k){ g.textContent = 'Kode atau link tidak valid. Periksa lagi kiriman dari tim O&M SEI.'; return; }
  g.textContent = '';
  const a = { mode:'tamu', kode:k }; simpan(a); tampilkan(a);
}

function toggleMenu(){ const m = document.getElementById('menu'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; }
function muatUlang(){ const a = baca(); toggleMenu(); if (a) document.getElementById('app').src = urlDari(a); }
function bukaBrowser(){ const a = baca(); toggleMenu(); if (a) window.open(urlDari(a), '_blank'); }
function gantiAkses(){
  hapus(); toggleMenu();
  const f = document.getElementById('app'); f.src = 'about:blank'; f.style.display = 'none';
  document.getElementById('gear').style.display = 'none';
  document.getElementById('awal').style.display = 'flex';
}

/* Tutup menu bila mengetuk di luar menu */
document.addEventListener('click', e => {
  const m = document.getElementById('menu');
  if (m.style.display === 'block' && !m.contains(e.target) && e.target.id !== 'gear') m.style.display = 'none';
});

/* Link tamu bisa dibuka langsung: …/index.html?k=KODE */
(function mulai(){
  const kUrl = ambilKode(location.search);
  if (kUrl){ const a = { mode:'tamu', kode:kUrl }; simpan(a); history.replaceState(null, '', location.pathname); tampilkan(a); return; }
  const a = baca();
  if (a && (a.mode === 'sei' || (a.mode === 'tamu' && a.kode))) tampilkan(a);
})();

/* Service worker: syarat aplikasi bisa dipasang & dibuat APK */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
